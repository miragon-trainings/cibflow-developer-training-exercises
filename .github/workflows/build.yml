# Prüft das Übungs-Repo bei jedem Push und Pull Request auf main.
#
#   startstand          Der fertige Worker unter worker/ baut. Dazu: Das Projekt-ZIP passt zum Modell,
#                       die Musterlösung unter loesung/prozesstest-java/ ist vollständig und weicht nur in den
#                       Übungsdateien vom Startstand prozesstest-java/ ab, die hexagonale Fassung lässt ihre Kopien
#                       aus worker/ unverändert (.github/scripts/loesung-abgleich.sh). Das Element Template unter
#                       loesung/element-template/ ist gültiges JSON und setzt an Task_Verbuchen Typ und Topic der
#                       Entwickler-Fassung.
#   musterloesung       Der fertige Worker unter worker/ und seine hexagonale Fassung unter loesung/worker-hexagonal/
#                       (Domäne, Ports, Adapter, Architekturtests): Build für beide, Unit- und Architekturtests der
#                       hexagonalen Fassung ohne Engine, Engine per Docker Compose, Deployment mit "dotnet run -- deploy"
#                       aus worker/: erst der Startstand (fertiges Modell nach Übung 7, nur User Tasks), dann wie in
#                       Übung 8 die Entwickler-Fassung mit External Task. Danach Smoke-Test und die Prozesstests gegen
#                       die Engine, erst der Prozesstest in C# unter worker/, dann die der hexagonalen Fassung.
#                       Zuletzt läuft der fertige Worker selbst und verbucht einen Antrag, einen zweiten lehnt er ab.
#   java-startstand     Der Prozesstest in Java unter prozesstest-java/: Die Modellkopien sind byte-gleich zur
#                       Entwickler-Fassung und zur Variante, der Happy Path läuft grün, die drei TODO-Tests sind
#                       übersprungen, nicht rot. Dazu: Die Modellkopie der Demo in Kapitel 10 ist der Startstand.
#   java-musterloesung  Die Musterlösung unter loesung/prozesstest-java/, ein vollständiges Projekt:
#                       alle Tests grün, keiner übersprungen, die Demo-Tests am Modell ohne External Task und
#                       der Bonus Fehlerpfad eingeschlossen. Die Abdeckungsberichte je Testklasse
#                       (target/process-test-coverage) lädt der Job als Artefakt abdeckung-musterloesung hoch.
#   java-jgiven         Der Ausblick in Kapitel 10 unter loesung/prozesstest-jgiven/, ein eigenes Projekt: Die Modellkopie
#                       ist der Startstand unter prozess/, die zwei Szenarien mit JGiven laufen grün, keins übersprungen,
#                       das JSON für den Bericht von JGiven und der Abdeckungsbericht liegen da. Den HTML-Bericht von
#                       JGiven (./mvnw jgiven:report) baut der Job nicht.
#                       Die Java-Jobs brauchen weder Docker noch Zugangsdaten, die Engine läuft im Speicher.
#
# Warum die CI gegen reines CIB seven läuft und nicht gegen den CIB flow Stack aus stack/:
# Die CIB flow Images liegen in einer privaten Registry (harbor.cib.de), die CI hat dafür keinen Zugang.
# CIB flow läuft auf der Engine CIB seven, mit derselben REST-API. Worker, Deployment, Smoke-Test und die
# Prozesstests in C# sprechen nur mit dieser REST-API, deshalb prüft .github/ci-stack/ sie genauso gut.
# Die Formulare (easyForms) prüft die CI nicht, sie brauchen CIB flow.
#
# Die Zugangsdaten sind die lokalen Dev-Benutzer, die stack/init/benutzer-anlegen.sh anlegt (worker/worker).
# Sie stehen auch in der README und sind keine Secrets.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Von Hand starten, etwa vor einer Schulung: Actions, Build, "Run workflow"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  startstand:
    name: Startstand bauen und testen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Worker bauen
        run: dotnet build worker/GenehmigungWorker.sln

      - name: Musterlösung in Java vollständig, hexagonale Fassung teilt ihre Kopien mit worker/
        run: .github/scripts/loesung-abgleich.sh

      - name: Projekt-ZIP passt zum Modell
        run: |
          # Das BPMN im Projekt-ZIP muss byte-gleich prozess/genehmigungsworkflow.bpmn sein
          if ! unzip -p prozess/genehmigungsworkflow-projekt.zip diagrams/genehmigungsworkflow.bpmn \
              | cmp -s - prozess/genehmigungsworkflow.bpmn; then
            echo "::error::Das BPMN im Projekt-ZIP weicht von prozess/genehmigungsworkflow.bpmn ab. Neu bauen: python3 prozess/projekt-zip-bauen.py"
            exit 1
          fi
          # Und das ganze ZIP muss sich aus Modell und Formularen genau so neu bauen lassen
          python3 prozess/projekt-zip-bauen.py "$RUNNER_TEMP/projekt.zip"
          if ! cmp -s "$RUNNER_TEMP/projekt.zip" prozess/genehmigungsworkflow-projekt.zip; then
            echo "::error::Das Projekt-ZIP ist nicht aktuell. Neu bauen: python3 prozess/projekt-zip-bauen.py"
            exit 1
          fi

      - name: Element Template passt zum Modell
        run: |
          # "Euer Worker als Baustein" in Übung 9: Die Vorlage muss gültiges JSON sein und an Task_Verbuchen
          # der Entwickler-Fassung genau das setzen, was dort steht: Elementtyp, camunda:type und Topic.
          # Weicht das Topic ab, holt der Worker nach dem Anwenden der Vorlage keinen Task mehr.
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          VORLAGE = "loesung/element-template/genehmigung-verbuchen.json"
          MODELL = "loesung/genehmigungsworkflow-entwickler.bpmn"
          CAMUNDA = "{http://camunda.org/schema/1.0/bpmn}"

          try:
              with open(VORLAGE, encoding="utf-8") as datei:
                  vorlage = json.load(datei)
          except json.JSONDecodeError as fehler:
              print(f"::error file={VORLAGE},line={fehler.lineno},col={fehler.colno}::{VORLAGE} ist kein gültiges JSON: {fehler.msg}")
              raise SystemExit(1)

          def gebunden(attribut):
              # Werte aller Properties der Vorlage, die per "property" an dieses Attribut des Elements binden
              return [p.get("value") for p in vorlage.get("properties", [])
                      if p.get("binding", {}).get("type") == "property" and p.get("binding", {}).get("name") == attribut]

          task = next((e for e in ET.parse(MODELL).iter() if e.get("id") == "Task_Verbuchen"), None)
          if task is None:
              print(f"::error::{MODELL} hat kein Element Task_Verbuchen")
              raise SystemExit(1)

          art = task.tag.split("}")[-1]
          erwartet = {
              "appliesTo": "bpmn:" + art[0].upper() + art[1:],
              "camunda:type": task.get(CAMUNDA + "type"),
              "camunda:topic": task.get(CAMUNDA + "topic"),
          }
          gefunden = {
              "appliesTo": vorlage.get("appliesTo", []),
              "camunda:type": gebunden("camunda:type"),
              "camunda:topic": gebunden("camunda:topic"),
          }

          fehler = 0
          for schluessel, wert in erwartet.items():
              if gefunden[schluessel] != [wert]:
                  print(f"::error file={VORLAGE}::{schluessel} in der Vorlage ist {gefunden[schluessel]}, "
                        f"an Task_Verbuchen in {MODELL} steht {wert!r}. Gleicht die Vorlage an das Modell an.")
                  fehler = 1
          if fehler:
              raise SystemExit(1)
          print(f"Element Template passt zum Modell: {erwartet['appliesTo']}, "
                f"camunda:type {erwartet['camunda:type']}, Topic {erwartet['camunda:topic']}")
          PY

  musterloesung:
    name: Musterlösung gegen die lokale Engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Worker bauen
        run: dotnet build worker/GenehmigungWorker.sln

      - name: Hexagonale Fassung bauen
        run: dotnet build loesung/worker-hexagonal/GenehmigungWorker.sln

      - name: Hexagonale Fassung, Unit-Tests und Architekturtests ohne Engine
        run: dotnet test loesung/worker-hexagonal/GenehmigungWorker.sln --no-build --filter "Kategorie!=Prozesstest" --logger "console;verbosity=normal"

      - name: Engine starten (CIB seven, siehe oben)
        working-directory: .github/ci-stack
        run: docker compose up -d

      - name: Warten, bis init Benutzer, Gruppe und Filter angelegt hat
        working-directory: .github/ci-stack
        timeout-minutes: 13
        run: |
          # init wartet selbst bis zu zehn Minuten auf die Engine und beendet sich dann.
          # Exit-Code 0 heißt: Benutzer, Gruppe genehmiger und Tasklist-Filter sind da.
          init=$(docker compose ps -aq init)
          for _ in $(seq 1 144); do
            if [ "$(docker inspect -f '{{.State.Status}}' "$init")" = "exited" ]; then
              docker compose logs init
              code=$(docker inspect -f '{{.State.ExitCode}}' "$init")
              if [ "$code" = "0" ]; then
                exit 0
              fi
              echo "::error::init endete mit Exit-Code $code"
              exit 1
            fi
            sleep 5
          done
          docker compose logs init
          echo "::error::init ist nach zwölf Minuten nicht fertig"
          exit 1

      - name: Startstand deployen (fertiges Modell nach Übung 7, nur User Tasks)
        env:
          EngineBenutzer: worker
          EnginePasswort: worker
        run: |
          # Erstes Deployment auf dem frischen Stack: Deploy.cs muss eine neue Version anlegen
          dotnet run --project worker/src/GenehmigungWorker --no-build -- deploy | tee deploy.log
          grep -q "Neue Version: Process_Genehmigung, Version 1" deploy.log

      - name: Übung 8 nachstellen (Entwickler-Fassung ablegen und deployen)
        env:
          EngineBenutzer: worker
          EnginePasswort: worker
        run: |
          # Wie der Rückfall in Übung 8: Die fertige Fassung ersetzt das Modell unter prozess/.
          # Der Umbau muss als nächste Version ankommen, sonst holt kein Worker je einen Task.
          cp loesung/genehmigungsworkflow-entwickler.bpmn prozess/genehmigungsworkflow.bpmn
          dotnet run --project worker/src/GenehmigungWorker --no-build -- deploy | tee deploy.log
          grep -q "Neue Version: Process_Genehmigung, Version 2" deploy.log

      - name: Smoke-Test (Anmeldung, Deployment, alle drei Pfade per REST)
        working-directory: stack
        run: ./smoke-test.sh

      - name: Prozesstest in C# gegen die Engine (Happy Path und Gegenprobe)
        env:
          EngineBenutzer: worker
          EnginePasswort: worker
        run: |
          dotnet test worker/GenehmigungWorker.sln --no-build --filter "Kategorie=Prozesstest" --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=prozesstest.trx" --results-directory "$RUNNER_TEMP/worker-tests"
          # Findet der Filter keinen Test, etwa nach einem umbenannten Trait, endet dotnet test trotzdem mit Exit-Code 0
          zaehler=$(grep -o '<Counters [^>]*>' "$RUNNER_TEMP/worker-tests/prozesstest.trx")
          echo "$zaehler"
          for erwartet in 'total="2"' 'passed="2"'; do
            case "$zaehler" in
              *"$erwartet"*) ;;
              *) echo "::error::Erwartet: 2 Prozesstests in C# bestanden, Happy Path und Gegenprobe. Abweichung bei $erwartet"; exit 1 ;;
            esac
          done

      - name: Hexagonale Fassung, Prozesstests gegen dieselbe Engine
        env:
          EngineBenutzer: worker
          EnginePasswort: worker
        # Dieselben Fälle über Adapter und Use Case statt Handler, dazu der Fehlerpfad:
        # Die Variante mit Error-Boundary deployt FehlerpfadTests selbst.
        run: dotnet test loesung/worker-hexagonal/GenehmigungWorker.sln --no-build --filter "Kategorie=Prozesstest" --logger "console;verbosity=normal"

      - name: Fertiger Worker verbucht, wie ab Übung 8
        env:
          EngineBenutzer: worker
          EnginePasswort: worker
        run: |
          # Der Prozesstest in C# ruft den Handler mit einem Fake. Hier läuft der Worker selbst, wie ab Übung 8 bei allen:
          # Schleife, Simulation, complete und bpmnError gegen die Engine. 1.200 Euro enden bei "Antrag genehmigt" mit
          # buchungsnummer, 60.000 Euro lehnt die Simulation ab, die Variante mit Error-Boundary führt zu "Buchung klären".
          set -euo pipefail
          api=http://localhost:8080/engine-rest
          rest() { # benutzer methode pfad [json]
            if [ $# -ge 4 ]; then
              curl -fsS --max-time 30 -u "$1:$1" -X "$2" -H 'Content-Type: application/json' --data "$4" "$api$3"
            else
              curl -fsS --max-time 30 -u "$1:$1" -X "$2" "$api$3"
            fi
          }
          # Fragt bis zu 60 Sekunden lang, bis der jq-Ausdruck auf die Antwort einen Wert liefert, und gibt ihn aus
          warte_auf() { # beschreibung benutzer pfad jq-ausdruck
            local wert
            for _ in $(seq 1 60); do
              wert=$(rest "$2" GET "$3" | jq -r "$4 // empty") || wert=""
              if [ -n "$wert" ]; then echo "$wert"; return 0; fi
              sleep 1
            done
            echo "::error::$1: nach 60 Sekunden nicht erreicht" >&2
            return 1
          }

          dotnet worker/src/GenehmigungWorker/bin/Debug/net10.0/GenehmigungWorker.dll > worker.log 2>&1 &
          worker=$!
          trap 'kill "$worker" 2>/dev/null || true; echo "Log des Workers:"; cat worker.log' EXIT

          echo "Genehmigt: als anna starten, als gerda genehmigen, der Worker verbucht"
          pi=$(rest anna POST /process-definition/key/Process_Genehmigung/start \
            '{"variables":{"betrag":{"value":1200,"type":"Long"},"begruendung":{"value":"Fertiger Worker in der CI","type":"String"}}}' | jq -r .id)
          task=$(warte_auf '"Antrag prüfen" bei gerda' gerda "/task?processInstanceId=$pi&taskDefinitionKey=Task_Pruefen" '.[0].id')
          rest gerda POST "/task/$task/complete" '{"variables":{"entscheidung":{"value":"genehmigt","type":"String"}}}'
          warte_auf 'Instanz beendet' worker "/history/process-instance/$pi" 'select(.state == "COMPLETED") | .id' > /dev/null
          warte_auf 'Ende "Antrag genehmigt"' worker "/history/activity-instance?processInstanceId=$pi&activityId=End_Genehmigt" '.[0].id' > /dev/null
          nummer=$(warte_auf buchungsnummer worker "/history/variable-instance?processInstanceId=$pi&variableName=buchungsnummer" '.[0].value')
          echo "buchungsnummer = $nummer"
          if ! [[ "$nummer" =~ ^B-[0-9]{4}-[0-9]{4}$ ]] || ! grep -qF "Verbucht: $nummer für anna" worker.log; then
            echo "::error::Erwartet: buchungsnummer B-<Jahr>-<Nummer> aus der Simulation und \"Verbucht: $nummer für anna\" im Log"
            exit 1
          fi

          echo "Abgelehnt: Variante deployen, 60.000 Euro starten, der Worker meldet bpmnError"
          dotnet run --project worker/src/GenehmigungWorker --no-build -- deploy prozess/varianten/verbuchen-fehlerpfad.bpmn
          pi=$(rest anna POST /process-definition/key/Process_VerbuchenFehlerpfad/start \
            '{"variables":{"antragsteller":{"value":"anna","type":"String"},"betrag":{"value":60000,"type":"Long"},"begruendung":{"value":"Fertiger Worker in der CI","type":"String"}}}' | jq -r .id)
          warte_auf '"Buchung klären" bei gerda' gerda "/task?processInstanceId=$pi&taskDefinitionKey=Task_BuchungKlaeren" '.[0].id' > /dev/null
          code=$(rest worker GET "/process-instance/$pi/variables/errorCode" | jq -r .value)
          if [ "$code" != "BUCHUNG_ABGELEHNT" ] || ! grep -q "fachlich abgelehnt: Budget der Kostenstelle reicht nicht" worker.log; then
            echo "::error::Erwartet: errorCode BUCHUNG_ABGELEHNT an der Instanz (ist: $code) und \"fachlich abgelehnt\" im Log"
            exit 1
          fi

      - name: Zustand der Engine bei Fehler
        if: failure()
        working-directory: .github/ci-stack
        run: |
          docker compose ps -a
          docker compose logs --tail 200

      - name: Engine abbauen
        if: always()
        working-directory: .github/ci-stack
        run: docker compose down -v

  java-startstand:
    name: Java-Prozesstest (Startstand)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prozesstest-java
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Modellkopien passen zu Entwickler-Fassung, Variante und Startstand
        run: |
          # Der Test liest das Modell aus dem eigenen Projekt. Getestet wird die Entwickler-Fassung, also das Modell
          # nach Übung 8. Im Repo müssen die Kopien byte-gleich zu loesung/genehmigungsworkflow-entwickler.bpmn bleiben.
          # Die Kopien unter loesung/prozesstest-java/ prüft .github/scripts/loesung-abgleich.sh gegen diese hier.
          fehler=0
          for paar in "genehmigungsworkflow.bpmn:../loesung/genehmigungsworkflow-entwickler.bpmn" \
                      "verbuchen-fehlerpfad.bpmn:../prozess/varianten/verbuchen-fehlerpfad.bpmn"; do
            kopie="src/main/resources/${paar%%:*}"
            vorlage="${paar#*:}"
            if ! cmp -s "$kopie" "$vorlage"; then
              echo "::error::prozesstest-java/$kopie weicht von ${vorlage#../} ab. Neu kopieren: cp ${vorlage#../} prozesstest-java/$kopie und cp ${vorlage#../} loesung/prozesstest-java/$kopie"
              fehler=1
            fi
          done
          # Die Demo in Kapitel 10 testet das Modell ohne External Task: Ihre Kopie ist der Startstand unter prozess/
          demo=../loesung/prozesstest-java/src/main/resources/genehmigungsworkflow-tag1.bpmn
          if ! cmp -s "$demo" ../prozess/genehmigungsworkflow.bpmn; then
            echo "::error::${demo#../} weicht von prozess/genehmigungsworkflow.bpmn ab. Nach der Demo in Kapitel 10: git restore loesung/prozesstest-java. Nach einer Änderung am Startstand: cp prozess/genehmigungsworkflow.bpmn ${demo#../}"
            fehler=1
          fi
          exit $fehler

      - name: JDK 21 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: prozesstest-java/pom.xml

      - name: Prozesstests ausführen (Engine im Speicher, die TODO-Tests sind übersprungen)
        run: ./mvnw -B -ntp test

      - name: Startstand meldet 1 bestanden, 3 übersprungen
        run: |
          # Überspringen ist für Maven kein Fehler. Hier fällt auf, wenn die Musterlösung im Startstand gelandet ist
          # oder sich die Zahl der Tests ändert, ohne dass README und Aufgabenblatt mitziehen.
          bericht=target/surefire-reports/TEST-io.miragon.schulung.genehmigung.GenehmigungsworkflowTest.xml
          kopf=$(grep -o '<testsuite [^>]*>' "$bericht")
          echo "$kopf"
          for erwartet in 'tests="4"' 'skipped="3"' 'failures="0"' 'errors="0"'; do
            case "$kopf" in
              *"$erwartet"*) ;;
              *) echo "::error::Im Startstand erwartet: 4 Tests, 3 übersprungen. Abweichung bei $erwartet"; exit 1 ;;
            esac
          done
          anzahl=$(ls target/surefire-reports/TEST-*.xml | wc -l)
          if [ "$anzahl" -ne 1 ]; then
            echo "::error::Im Startstand erwartet: genau eine Testklasse, gefunden: $anzahl"
            exit 1
          fi

  java-musterloesung:
    name: Java-Prozesstest (Musterlösung)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: loesung/prozesstest-java
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: JDK 21 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: loesung/prozesstest-java/pom.xml

      - name: Prozesstests ausführen (Engine im Speicher)
        run: ./mvnw -B -ntp test

      - name: Kein Test übersprungen, Demo-Tests und Bonus Fehlerpfad dabei
        run: |
          # Maven zählt übersprungene Tests nicht als Fehler. In der Musterlösung darf keiner übersprungen sein.
          grep -o '<testsuite [^>]*>' target/surefire-reports/TEST-*.xml
          if grep -o '<testsuite [^>]*>' target/surefire-reports/TEST-*.xml | grep -v 'skipped="0"'; then
            echo "::error::In der Musterlösung ist ein Test übersprungen"
            exit 1
          fi
          if [ ! -f target/surefire-reports/TEST-io.miragon.schulung.genehmigung.FehlerpfadTest.xml ]; then
            echo "::error::Der Bonus FehlerpfadTest ist nicht gelaufen"
            exit 1
          fi
          if [ ! -f target/surefire-reports/TEST-io.miragon.schulung.genehmigung.GenehmigungsworkflowTag1Test.xml ]; then
            echo "::error::Die Demo-Tests am Modell ohne External Task (GenehmigungsworkflowTag1Test) sind nicht gelaufen"
            exit 1
          fi

      # Je Testklasse ein HTML-Bericht: das Modell, darin grün, was die Tests durchlaufen haben. Zum Ansehen
      # entpacken und report.html im Browser öffnen. Fehlen die Berichte trotz grüner Tests, wird der Job rot.
      - name: Abdeckungsberichte hochladen
        uses: actions/upload-artifact@v7
        with:
          name: abdeckung-musterloesung
          path: loesung/prozesstest-java/target/process-test-coverage/
          if-no-files-found: error

  java-jgiven:
    name: JGiven-Demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: loesung/prozesstest-jgiven
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Modellkopie ist der Startstand
        run: |
          # Die Szenarien testen dasselbe Modell wie die Demo in loesung/prozesstest-java: das fertige Modell nach Übung 7
          kopie=src/main/resources/genehmigungsworkflow-tag1.bpmn
          if ! cmp -s "$kopie" ../../prozess/genehmigungsworkflow.bpmn; then
            echo "::error::loesung/prozesstest-jgiven/$kopie weicht von prozess/genehmigungsworkflow.bpmn ab. Nach einer Änderung am Startstand: cp prozess/genehmigungsworkflow.bpmn loesung/prozesstest-jgiven/$kopie, nach einem Ausprobieren: git restore loesung/prozesstest-jgiven"
            exit 1
          fi

      - name: JDK 21 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: loesung/prozesstest-jgiven/pom.xml

      - name: Szenarien ausführen (Engine im Speicher)
        run: ./mvnw -B -ntp test

      - name: Zwei Szenarien grün, keins übersprungen, JGiven-Bericht als JSON und Abdeckungsbericht da
        run: |
          # Überspringen ist für Maven kein Fehler, hier schon. Fehlt das JSON, hätte ./mvnw jgiven:report nichts zu zeigen.
          # Den Abdeckungsbericht schreibt die ProcessEngineCoverageExtension, mit der die Testklasse die Engine einbindet.
          bericht=target/surefire-reports/TEST-io.miragon.schulung.genehmigung.GenehmigungsworkflowSzenarioTest.xml
          kopf=$(grep -o '<testsuite [^>]*>' "$bericht")
          echo "$kopf"
          for erwartet in 'tests="2"' 'skipped="0"' 'failures="0"' 'errors="0"'; do
            case "$kopf" in
              *"$erwartet"*) ;;
