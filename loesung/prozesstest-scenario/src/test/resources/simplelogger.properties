# Engine-Logs leise: Auf der Konsole stehen nur der Lauf der Szenarien, der Testbaum und die Meldungen.
# Den Lauf schreibt der Runner von CIB seven Platform Scenario unter org.cibseven.community.scenario.
# Zum Nachsehen, was die Engine tut: defaultLogLevel auf info oder debug stellen und den Lauf wiederholen.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.org.cibseven.community.scenario=info
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
